apply plugin: 'com.android.application'

// Dynamic build incrementing: auto-increments with GITHUB_RUN_NUMBER so older installed apps recognize new APKs as seamless updates
def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: System.getenv("BUILD_NUMBER")
def computedVersionCode = 1
try {
    if (runNumber) {
        computedVersionCode = 100 + Integer.parseInt(runNumber.toString().trim())
    }
} catch (Exception e) {
    computedVersionCode = 1
}
def computedVersionName = runNumber ? "1.0.${runNumber}" : "1.0.0"

// Environment variable and signing diagnostics requested via overhaul.debug.signing.env
if (project.findProperty('overhaul.debug.signing.env') == 'true' || System.getenv("CI") == "true") {
    def keystoreFileEnv = System.getenv("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_PATH")
    def storePassEnv = System.getenv("KEYSTORE_PASSWORD")
    def keyAliasEnv = System.getenv("KEY_ALIAS")
    def keyPassEnv = System.getenv("KEY_PASSWORD")
    
    println "============================================================"
    println "[GRADLE DIAGNOSTIC] BUILD & SIGNING ENVIRONMENT VERIFICATION"
    println "  - CI Runner: ${System.getenv('CI') ?: 'false'}"
    println "  - GITHUB_RUN_NUMBER: ${runNumber ?: 'None (Local Build)'}"
    println "  - Computed versionCode: ${computedVersionCode}"
    println "  - Computed versionName: ${computedVersionName}"
    println "  - debug.keystore in app/: ${file('debug.keystore').exists()}"
    println "  - release.keystore in app/: ${file('release.keystore').exists()}"
    println "  - KEYSTORE_FILE / KEYSTORE_PATH: ${keystoreFileEnv ? 'Set (' + keystoreFileEnv + ')' : 'Not Set'}"
    println "  - KEYSTORE_PASSWORD: ${storePassEnv ? 'Set (Length: ' + storePassEnv.length() + ')' : 'Not Set'}"
    println "  - KEY_ALIAS: ${keyAliasEnv ? 'Set (' + keyAliasEnv + ')' : 'Not Set'}"
    println "  - KEY_PASSWORD: ${keyPassEnv ? 'Set (Length: ' + keyPassEnv.length() + ')' : 'Not Set'}"
    println "============================================================"
}

android {
    namespace = "com.overhaul.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.overhaul.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName computedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    aaptOptions {
         // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
         // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        debug {
            def keystoreFile = file('debug.keystore')
            if (!keystoreFile.exists()) {
                keystoreFile = rootProject.file('app/debug.keystore')
            }
            if (!keystoreFile.exists()) {
                keystoreFile = rootProject.file('debug.keystore')
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_PATH")
            def storePass = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPass = System.getenv("KEY_PASSWORD")

            if (keystorePath && storePass && kAlias && kPass) {
                def keystoreFile = file(keystorePath)
                if (!keystoreFile.exists()) {
                    keystoreFile = file("app/" + keystorePath)
                }
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword storePass
                    keyAlias kAlias
                    keyPassword kPass
                }
            }
        }
    }

    buildTypes {
        debug {
            // Strictly uses debug signing configuration - never forces release signature
            signingConfig signingConfigs.debug
        }
        release {
            // Safe fallback to debug signing if release credentials are absent to prevent build failures
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storePassword != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
