# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false

# AndroidX package structure and Jetifier migration support
android.useAndroidX=true
android.enableJetifier=true

# Detailed Diagnostic Logging & Stacktrace flags
org.gradle.logging.level=lifecycle
org.gradle.logging.stacktrace=all
org.gradle.warning.mode=all

# Enable environment variable & signing diagnostics in Gradle
overhaul.debug.signing.env=true
