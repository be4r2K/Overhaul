# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false

# AndroidX package structure (Jetifier is deprecated and disabled)
android.useAndroidX=true
android.enableJetifier=false

# Diagnostic Logging & Stacktrace flags
org.gradle.logging.level=lifecycle
org.gradle.logging.stacktrace=all

# Enable environment variable & signing diagnostics in Gradle
overhaul.debug.signing.env=true
