name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_HOME: ${{ steps.setup-java.outputs.path }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=512m' -Dorg.gradle.daemon=false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web Production Bundle
        run: bun run build

      - name: Sync Capacitor Native Assets
        run: bunx @capacitor/cli sync android || (bunx @capacitor/cli add android && bunx @capacitor/cli copy android)

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore Secret (Optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore 2>/dev/null || echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore decoded successfully."
          else
            echo "No custom keystore secret found, proceeding with Android default debug signing."
          fi

      - name: Build Android Debug APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CI: "true"
        run: |
          cd android
          chmod +x gradlew

          echo "============================================================"
          echo "=== 1. DIAGNOSTIC: ENVIRONMENT & TOOLCHAINS ==="
          echo "Java Version:"
          java -version
          echo "Gradle Version:"
          ./gradlew --version
          
          echo "=== 2. DIAGNOSTIC: KEYSTORE & ASSET VERIFICATION ==="
          ls -la app/debug.keystore 2>/dev/null && echo "✓ debug.keystore present in android/app/" || echo "✗ debug.keystore not found in android/app/"
          ls -la app/release.keystore 2>/dev/null && echo "✓ release.keystore present in android/app/" || echo "ℹ release.keystore not present in android/app/ (debug keystore will be used)"
          
          echo "=== 3. DIAGNOSTIC: SIGNING ENVIRONMENT VARIABLE AUDIT ==="
          [ -n "$KEYSTORE_FILE" ] && echo "✓ KEYSTORE_FILE is defined: $KEYSTORE_FILE" || echo "ℹ KEYSTORE_FILE is not defined"
          [ -n "$KEYSTORE_PATH" ] && echo "✓ KEYSTORE_PATH is defined: $KEYSTORE_PATH" || echo "ℹ KEYSTORE_PATH is not defined"
          [ -n "$KEYSTORE_PASSWORD" ] && echo "✓ KEYSTORE_PASSWORD is defined (length: ${#KEYSTORE_PASSWORD})" || echo "ℹ KEYSTORE_PASSWORD is not defined"
          [ -n "$KEY_ALIAS" ] && echo "✓ KEY_ALIAS is defined: $KEY_ALIAS" || echo "ℹ KEY_ALIAS is not defined"
          [ -n "$KEY_PASSWORD" ] && echo "✓ KEY_PASSWORD is defined (length: ${#KEY_PASSWORD})" || echo "ℹ KEY_PASSWORD is not defined"
          echo "============================================================"

          echo "=== 4. EXECUTING GRADLE ASSEMBLEDEBUG ==="
          ./gradlew assembleDebug --no-daemon --stacktrace --full-stacktrace --info -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overhaul-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
