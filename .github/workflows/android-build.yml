name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web Production Bundle
        run: bun run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Print & Verify Environment Variables
        run: |
          echo "============================================================"
          echo "=== 1. FULL RUNNER ENVIRONMENT VARIABLES (printenv) ==="
          printenv
          echo "============================================================"
          echo "=== 2. SEARCHING FOR SIGNING VARIABLES ==="
          printenv | grep -E '^(KEYSTORE_FILE|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)=' || echo "No matching signing variables found in printenv"
          echo "============================================================"
          echo "=== 3. VERIFYING EXPOSURE FOR BUILD ANDROID DEBUG APK ==="
          for var in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "$(printenv "$var")" ]; then
              echo "✓ $var is correctly exposed to environment"
            else
              echo "ℹ $var is not set in secrets/environment"
            fi
          done
          echo "============================================================"

      - name: Build Android Debug APK
        run: |
          echo "============================================================"
          echo "=== SIGNING ENVIRONMENT VARIABLES (printenv | grep KEY) ==="
          echo "============================================================"
          printenv | grep KEY || echo "No variables matching 'KEY' found in environment"
          echo "============================================================"

          cd android
          chmod +x gradlew

          echo "============================================================"
          echo "=== RUNNING GRADLE ASSEMBLEDEBUG WITH DIAGNOSTIC PROPERTIES ==="
          echo "============================================================"
          ./gradlew assembleDebug -Poverhaul.debug.signing.env=true --no-daemon --stacktrace --full-stacktrace --info --warning-mode=none -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: overhaul-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
